<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>معرض الخدمات والأعمال الاحترافية | MCT Studio</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM CDN -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel CDN for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Google Fonts: Cairo -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background-color: #0b0f19;
            color: #f3f4f6;
            overflow-x: hidden;
        }
        .glass {
            background: rgba(17, 24, 39, 0.75);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .glass-card {
            background: rgba(30, 41, 59, 0.5);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .glass-card:hover {
            transform: translateY(-5px);
            border-color: rgba(99, 102, 241, 0.4);
            box-shadow: 0 12px 30px -10px rgba(99, 102, 241, 0.25);
        }
        .glow-effect {
            position: absolute;
            width: 350px;
            height: 350px;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.15) 0%, rgba(0,0,0,0) 70%);
            pointer-events: none;
        }
        /* Instagram Aspect Ratios */
        .aspect-insta-post { aspect-ratio: 1 / 1; }
        .aspect-insta-portrait { aspect-ratio: 4 / 5; }
        .aspect-insta-story { aspect-ratio: 9 / 16; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const INITIAL_SERVICES = [
            {
                id: 1,
                title: "Pure Animation (أنيميشن كامل)",
                category: "أنيميشن",
                price: 650,
                unit: "للدقيقة / الفيديو",
                time: "3 أيام عمل",
                description: "فيديو أنيميشن وموشن جرافيك مخصص بالكامل من السكريبت والشخصيات للتحريك الاحترافي.",
                badge: "الأعلى طلباً",
                type: "pure"
            },
            {
                id: 2,
                title: "Mixed with Pic (دمج صور وأنيميشن)",
                category: "أنيميشن",
                price: 580,
                unit: "للدقيقة / الفيديو",
                time: "3 أيام عمل",
                description: "دمج متناسق بين صور المنتج أو العناصر الحقيقية مع لمسات تحريك ومؤثرات كرتونية حركية.",
                badge: "متميز",
                type: "mixed"
            },
            {
                id: 3,
                title: "Pictures + Words (تحريك صور ونصوص)",
                category: "أنيميشن",
                price: 480,
                unit: "للدقيقة / الفيديو",
                time: "3 أيام عمل",
                description: "عرض حركي سريع مخصص للإعلانات السريعة يعتمد على تحريك النصوص والصور الملونة.",
                badge: "اقتصادي",
                type: "pic_words"
            },
            {
                id: 4,
                title: "Design / Static Post (تصميم إعلاني)",
                category: "تصاميم",
                price: 180,
                unit: "للتصميم الواحد",
                time: "يومين عمل",
                description: "تصميم بوستر إعلاني ثابت للسوشيال ميديا متناسق الهوية وموجه لزيادة المبيعات.",
                badge: "سريع",
                type: "post"
            }
        ];

        const INITIAL_PACKS = [
            {
                id: 101,
                title: "Starter Pack (باقة البداية)",
                price: 1250,
                items: ["فيديو أنيميشن دقيقة (1 Min)", "4 تصاميم إعلانية ثابتة (4 Posts)"],
                savings: "توفير ممتاز للبداية"
            },
            {
                id: 102,
                title: "Growth Pack (باقة النمو)",
                price: 4080,
                items: ["فيديو أنيميشن دقيقة كاملة", "4 فيديوهات حركية سريعة", "12 تصميم إعلاني متنوع"],
                savings: "الأكثر قيمة للتجار"
            },
            {
                id: 103,
                title: "Posts Only Pack (باقة التصاميم)",
                price: 3260,
                items: ["32 تصميم إعلاني ثابت (4 بوستات أسبوعياً)"],
                savings: "تغطية شهرية كاملة"
            },
            {
                id: 104,
                title: "Videos Only Pack (باقة الفيديوهات)",
                price: 3120,
                items: ["2 فيديو أنيميشن دقيقة", "2 فيديو مدمج (Mixed)", "2 فيديو صور ونصوص"],
                savings: "لأصحاب الريلز والتيك توك"
            }
        ];

        const INITIAL_POLICIES = [
            { title: "مواعيد التسليم القياسية", detail: "تسليم الفيديو خلال 3 أيام عمل | تسليم التصميم الثابت خلال يومين عمل (يبدأ العد بعد اعتماد الفكرة والعربون)." },
            { title: "نظام الدفع المعتمد", detail: "دفع 50% عربون مقدم قبل بدء التنفيذ، و50% المتبقية بعد معاينة النموذج النهائي وقبل استلام الملفات." },
            { title: "سياسة التعديلات", detail: "تعديل مجاني جولة واحدة شاملة لكافة الملاحظات المجمعة على الفيديو أو التصميم." },
            { title: "الملفات المفتوحة (Source Files)", detail: "تسليم ملفات المشروع المفتوحة (PSD / Project Files) متاح برسوم إضافية 50 ج.م لكل تصميم." },
            { title: "صيغ التسليم الجاهزة", detail: "يتم تسليم الفيديوهات بصيغ MP4 عالية الجودة، والتصاميم بصيغ PNG / JPG جاهزة للنشر الفوري." }
        ];

        function App() {
            const [services, setServices] = useState(() => JSON.parse(localStorage.getItem('my_services')) || INITIAL_SERVICES);
            const [packs, setPacks] = useState(() => JSON.parse(localStorage.getItem('my_packs')) || INITIAL_PACKS);
            const [policies, setPolicies] = useState(() => JSON.parse(localStorage.getItem('my_policies')) || INITIAL_POLICIES);
            const [portfolio, setPortfolio] = useState(() => JSON.parse(localStorage.getItem('my_portfolio')) || [
                { id: 1, title: "بوستر إعلاني احترافي", ratio: "aspect-insta-portrait", image: "https://picsum.photos/800/1000?random=1", category: "تصاميم" },
                { id: 2, title: "شخصية أنيميشن كرتونية", ratio: "aspect-insta-post", image: "https://picsum.photos/800/800?random=2", category: "أنيميشن" },
                { id: 3, title: "إعلان متجر إلكتروني", ratio: "aspect-insta-story", image: "https://picsum.photos/720/1280?random=3", category: "ريلز" }
            ]);

            const [selectedItem, setSelectedItem] = useState(null);
            const [isAdminOpen, setIsAdminOpen] = useState(false);
            const [passcode, setPasscode] = useState("");
            const [isAuthenticated, setIsAuthenticated] = useState(false);
            const [adminTab, setAdminTab] = useState("service");

            // Form Inputs
            const [newTitle, setNewTitle] = useState("");
            const [newPrice, setNewPrice] = useState("");
            const [newDesc, setNewDesc] = useState("");
            const [newImg, setNewImg] = useState("");
            const [newRatio, setNewRatio] = useState("aspect-insta-post");

            useEffect(() => {
                localStorage.setItem('my_services', JSON.stringify(services));
                localStorage.setItem('my_packs', JSON.stringify(packs));
                localStorage.setItem('my_policies', JSON.stringify(policies));
                localStorage.setItem('my_portfolio', JSON.stringify(portfolio));
            }, [services, packs, policies, portfolio]);

            useEffect(() => {
                if (window.lucide) window.lucide.createIcons();
            }, [selectedItem, isAdminOpen, isAuthenticated, adminTab]);

            const handleLogin = (e) => {
                e.preventDefault();
                if (passcode === "12345") {
                    setIsAuthenticated(true);
                } else {
                    alert("الرقم السري غير صحيح!");
                }
            };

            const handleAddService = (e) => {
                e.preventDefault();
                if (!newTitle || !newPrice) return;
                const item = {
                    id: Date.now(),
                    title: newTitle,
                    price: Number(newPrice),
                    unit: "خدمة مخصصة",
                    time: "حسب الاتفاق",
                    description: newDesc || "تفاصيل الخدمة المضافة حديثاً.",
                    badge: "جديد"
                };
                setServices([...services, item]);
                resetForm();
            };

            const handleAddPortfolio = (e) => {
                e.preventDefault();
                if (!newTitle || !newImg) return;
                const item = {
                    id: Date.now(),
                    title: newTitle,
                    ratio: newRatio,
                    image: newImg,
                    category: "معرض الأعمال"
                };
                setPortfolio([item, ...portfolio]);
                resetForm();
            };

            const resetForm = () => {
                setNewTitle("");
                setNewPrice("");
                setNewDesc("");
                setNewImg("");
                alert("تمت الإضافة بنجاح!");
            };

            const sendToMessenger = (itemTitle) => {
                const text = encodeURIComponent(`مرحباً! أود الاستفسار والحصول على تفاصيل عن: ${itemTitle}`);
                window.open(`https://m.me/?text=${text}`, '_blank');
            };

            return (
                <div className="min-h-screen pb-20 relative">
                    <div className="glow-effect top-0 right-0"></div>
                    <div className="glow-effect top-1/3 left-0"></div>

                    {/* Navigation */}
                    <nav className="sticky top-0 z-40 glass border-b border-gray-800 px-4 py-3">
                        <div className="max-w-6xl mx-auto flex justify-between items-center">
                            <div className="flex items-center gap-2">
                                <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-500 to-purple-600 flex items-center justify-center font-black text-xl text-white shadow-lg shadow-indigo-500/30">
                                    M
                                </div>
                                <span className="font-bold text-lg tracking-wide bg-gradient-to-r from-white to-gray-400 bg-clip-text text-transparent">
                                    MCT STUDIO
                                </span>
                            </div>
                            <div className="flex items-center gap-4">
                                <a href="#services" className="text-xs md:text-sm text-gray-300 hover:text-indigo-400 transition">الخدمات</a>
                                <a href="#packs" className="text-xs md:text-sm text-gray-300 hover:text-indigo-400 transition">الباقات</a>
                                <a href="#policies" className="text-xs md:text-sm text-gray-300 hover:text-indigo-400 transition">السياسات</a>
                                <button 
                                    onClick={() => setIsAdminOpen(true)}
                                    className="p-2 rounded-lg bg-gray-800/80 hover:bg-indigo-600/30 text-gray-400 hover:text-indigo-400 border border-gray-700 transition"
                                    title="لوحة التحكم السريّة"
                                >
                                    <i data-lucide="lock" className="w-4 h-4"></i>
                                </button>
                            </div>
                        </div>
                    </nav>

                    {/* Hero Section */}
                    <header className="max-w-4xl mx-auto text-center px-4 pt-14 pb-10">
                        <span className="px-4 py-1.5 rounded-full text-xs font-semibold bg-indigo-500/10 text-indigo-400 border border-indigo-500/20 inline-block mb-4">
                            تصميم & أنيميشن إعلاني موجه للنتائج
                        </span>
                        <h1 className="text-3xl md:text-5xl font-extrabold text-white leading-tight mb-5">
                            حول أفكارك إلى <span className="bg-gradient-to-r from-indigo-400 via-purple-400 to-pink-400 bg-clip-text text-transparent">فيديوهات متحركة وتصاميم</span> تضاعف مبيعاتك
                        </h1>
                        <p className="text-gray-400 text-xs md:text-sm max-w-2xl mx-auto leading-relaxed mb-6">
                            اختر الخدمة المناسبة لمشروعك، اضغط لمعاينة التفاصيل والسياسات، وابدأ فوراً عبر تواصل مباشر وسريع.
                        </p>
                    </header>

                    {/* Services Section */}
                    <section id="services" className="max-w-6xl mx-auto px-4 py-8">
                        <h2 className="text-xl md:text-2xl font-bold text-white mb-6 flex items-center gap-2">
                            <i data-lucide="sparkles" className="text-indigo-400"></i> قائمة الخدمات المباشرة
                        </h2>
                        <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-5">
                            {services.map((srv) => (
                                <div 
                                    key={srv.id} 
                                    onClick={() => setSelectedItem(srv)}
                                    className="glass-card rounded-2xl p-5 cursor-pointer relative flex flex-col justify-between group"
                                >
                                    <div>
                                        <div className="flex justify-between items-start mb-3">
                                            <span className="text-[11px] px-2.5 py-0.5 rounded-md bg-indigo-500/20 text-indigo-300 font-semibold">
                                                {srv.badge || "خدمة"}
                                            </span>
                                            <i data-lucide="arrow-up-left" className="w-5 h-5 text-gray-500 group-hover:text-indigo-400 transition"></i>
                                        </div>
                                        <h3 className="font-bold text-base text-white mb-2">{srv.title}</h3>
                                        <p className="text-gray-400 text-xs line-clamp-2 mb-4 leading-relaxed">{srv.description}</p>
                                    </div>
                                    <div className="border-t border-gray-800 pt-3 flex justify-between items-end">
                                        <div>
                                            <span className="text-[10px] text-gray-500 block">التكلفة:</span>
                                            <span className="text-lg font-extrabold text-indigo-400">{srv.price} <span className="text-xs font-normal text-gray-300">ج.م</span></span>
                                        </div>
                                        <span className="text-[11px] text-gray-400">{srv.time}</span>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </section>

                    {/* Packages Section */}
                    <section id="packs" className="max-w-6xl mx-auto px-4 py-10">
                        <h2 className="text-xl md:text-2xl font-bold text-white mb-6 flex items-center gap-2">
                            <i data-lucide="package" className="text-indigo-400"></i> الباقات الجاهزة الموفرة
                        </h2>
                        <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-5">
                            {packs.map((pack) => (
                                <div key={pack.id} className="glass-card rounded-2xl p-5 flex flex-col justify-between border-t-2 border-t-indigo-500">
                                    <div>
                                        <span className="text-[11px] font-bold text-emerald-400 mb-2 block">{pack.savings}</span>
                                        <h3 className="font-bold text-lg text-white mb-3">{pack.title}</h3>
                                        <ul className="space-y-2 mb-6">
                                            {pack.items.map((item, idx) => (
                                                <li key={idx} className="text-xs text-gray-300 flex items-center gap-2">
                                                    <i data-lucide="check-circle-2" className="w-4 h-4 text-indigo-400 flex-shrink-0"></i>
                                                    {item}
                                                </li>
                                            ))}
                                        </ul>
                                    </div>
                                    <div>
                                        <div className="text-xl font-black text-white mb-4">
                                            {pack.price} <span className="text-xs font-normal text-gray-400">جنيه مصري</span>
                                        </div>
                                        <button 
                                            onClick={() => sendToMessenger(pack.title)}
                                            className="w-full py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-xs transition shadow-lg shadow-indigo-600/30"
                                        >
                                            طلب الباقة الآن
                                        </button>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </section>

                    {/* Portfolio / Instagram Showcase */}
                    <section className="max-w-6xl mx-auto px-4 py-10">
                        <h2 className="text-xl md:text-2xl font-bold text-white mb-2 flex items-center gap-2">
                            <i data-lucide="layout-grid" className="text-indigo-400"></i> معرض الأعمال (أبعاد إنستجرام)
                        </h2>
                        <p className="text-gray-400 text-xs mb-6">استعراض الصور والتصاميم بجميع مقاسات السوشيال ميديا دون اقتطاع.</p>
                        
                        <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6 items-start">
                            {portfolio.map((item) => (
                                <div key={item.id} className="glass-card rounded-2xl overflow-hidden p-3">
                                    <div className={`w-full ${item.ratio} rounded-xl overflow-hidden bg-gray-900 relative group`}>
                                        <img 
                                            src={item.image} 
                                            alt={item.title} 
                                            className="w-full h-full object-cover group-hover:scale-105 transition duration-500"
                                        />
                                        <div className="absolute inset-0 bg-gradient-to-t from-black/80 via-transparent to-transparent opacity-0 group-hover:opacity-100 transition flex items-end p-4">
                                            <span className="text-xs font-bold text-white">{item.title}</span>
                                        </div>
                                    </div>
                                    <div className="mt-2.5 flex justify-between items-center px-1">
                                        <span className="text-xs font-semibold text-gray-300">{item.title}</span>
                                        <span className="text-[10px] px-2 py-0.5 rounded bg-gray-800 text-gray-400">{item.category}</span>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </section>

                    {/* Policies Section */}
                    <section id="policies" className="max-w-4xl mx-auto px-4 py-10">
                        <div className="glass rounded-3xl p-6 md:p-8 border border-gray-800">
                            <h2 className="text-xl md:text-2xl font-bold text-white mb-6 flex items-center gap-2">
                                <i data-lucide="shield-check" className="text-indigo-400"></i> سياسات العمل والضوابط المعتمدة
                            </h2>
                            <div className="space-y-3">
                                {policies.map((pol, idx) => (
                                    <div key={idx} className="p-4 rounded-xl bg-gray-900/60 border border-gray-800/80">
                                        <h3 className="font-bold text-indigo-300 text-xs md:text-sm mb-1">{pol.title}</h3>
                                        <p className="text-gray-300 text-xs leading-relaxed">{pol.detail}</p>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </section>

                    {/* Detail Modal */}
                    {selectedItem && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm">
                            <div className="glass-card rounded-3xl p-6 max-w-lg w-full relative border border-gray-700 animate-in fade-in zoom-in duration-200">
                                <button 
                                    onClick={() => setSelectedItem(null)}
                                    className="absolute top-4 left-4 text-gray-400 hover:text-white p-2"
                                >
                                    <i data-lucide="x" className="w-5 h-5"></i>
                                </button>

                                <span className="text-[11px] px-3 py-1 rounded-full bg-indigo-500/20 text-indigo-300 font-bold mb-3 inline-block">
                                    {selectedItem.badge || "تفاصيل الخدمة"}
                                </span>
                                <h3 className="text-xl font-extrabold text-white mb-2">{selectedItem.title}</h3>
                                <p className="text-gray-300 text-xs md:text-sm leading-relaxed mb-6">{selectedItem.description}</p>

                                <div className="grid grid-cols-2 gap-4 p-4 rounded-2xl bg-gray-900/80 mb-6 border border-gray-800">
                                    <div>
                                        <span className="text-[10px] text-gray-500 block">السعر الأساسي:</span>
                                        <span className="text-xl font-black text-indigo-400">{selectedItem.price} ج.م</span>
                                    </div>
                                    <div>
                                        <span className="text-[10px] text-gray-500 block">مدة التنفيذ:</span>
                                        <span className="text-xs font-bold text-gray-200">{selectedItem.time}</span>
                                    </div>
                                </div>

                                <div className="flex gap-3">
                                    <button 
                                        onClick={() => sendToMessenger(selectedItem.title)}
                                        className="flex-1 py-3 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-xs md:text-sm transition shadow-lg shadow-indigo-600/30 flex items-center justify-center gap-2"
                                    >
                                        <i data-lucide="message-square" className="w-4 h-4"></i> طلب الخدمة على ماسنجر
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Admin Modal */}
                    {isAdminOpen && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/85 backdrop-blur-md">
                            <div className="glass-card rounded-3xl p-6 max-w-md w-full relative border border-gray-700">
                                <button 
                                    onClick={() => setIsAdminOpen(false)}
                                    className="absolute top-4 left-4 text-gray-400 hover:text-white"
                                >
                                    <i data-lucide="x" className="w-5 h-5"></i>
                                </button>

                                {!isAuthenticated ? (
                                    <form onSubmit={handleLogin} className="space-y-4 pt-4">
                                        <h3 className="text-lg font-bold text-white text-center mb-1">لوحة التحكم السريّة</h3>
                                        <p className="text-xs text-gray-400 text-center mb-4">أدخل الرقم السري لإضافة خدمات أو صور جديدة</p>
                                        <input 
                                            type="password" 
                                            value={passcode}
                                            onChange={(e) => setPasscode(e.target.value)}
                                            placeholder="أدخل الرقم السري (12345)"
                                            className="w-full px-4 py-3 rounded-xl bg-gray-900 border border-gray-700 text-white text-center text-base focus:outline-none focus:border-indigo-500"
                                        />
                                        <button type="submit" className="w-full py-3 rounded-xl bg-indigo-600 text-white font-bold text-xs">
                                            دخول
                                        </button>
                                    </form>
                                ) : (
                                    <div>
                                        <div className="flex border-b border-gray-800 mb-4 pb-2 gap-4">
                                            <button 
                                                onClick={() => setAdminTab("service")} 
                                                className={`text-xs font-bold ${adminTab === "service" ? "text-indigo-400 border-b-2 border-indigo-400 pb-1" : "text-gray-500"}`}
                                            >
                                                + إضافة خدمة
                                            </button>
                                            <button 
                                                onClick={() => setAdminTab("portfolio")} 
                                                className={`text-xs font-bold ${adminTab === "portfolio" ? "text-indigo-400 border-b-2 border-indigo-400 pb-1" : "text-gray-500"}`}
                                            >
                                                + إضافة صورة/عمل
                                            </button>
                                        </div>

                                        {adminTab === "service" ? (
                                            <form onSubmit={handleAddService} className="space-y-3">
                                                <input 
                                                    type="text" 
                                                    placeholder="عنوان الخدمة" 
                                                    value={newTitle} 
                                                    onChange={(e) => setNewTitle(e.target.value)}
                                                    className="w-full p-2.5 rounded-lg bg-gray-900 border border-gray-800 text-xs text-white"
                                                />
                                                <input 
                                                    type="number" 
                                                    placeholder="السعر (بالجنيه)" 
                                                    value={newPrice} 
                                                    onChange={(e) => setNewPrice(e.target.value)}
                                                    className="w-full p-2.5 rounded-lg bg-gray-900 border border-gray-800 text-xs text-white"
                                                />
                                                <textarea 
                                                    placeholder="الوصف المختصر" 
                                                    value={newDesc} 
                                                    onChange={(e) => setNewDesc(e.target.value)}
                                                    className="w-full p-2.5 rounded-lg bg-gray-900 border border-gray-800 text-xs text-white h-20"
                                                ></textarea>
                                                <button type="submit" className="w-full py-2.5 rounded-xl bg-indigo-600 text-white font-bold text-xs">
                                                    حفظ الخدمة
                                                </button>
                                            </form>
                                        ) : (
                                            <form onSubmit={handleAddPortfolio} className="space-y-3">
                                                <input 
                                                    type="text" 
                                                    placeholder="عنوان العمل" 
                                                    value={newTitle} 
                                                    onChange={(e) => setNewTitle(e.target.value)}
                                                    className="w-full p-2.5 rounded-lg bg-gray-900 border border-gray-800 text-xs text-white"
                                                />
                                                <input 
                                                    type="text" 
                                                    placeholder="رابط الصورة (Image URL)" 
                                                    value={newImg} 
                                                    onChange={(e) => setNewImg(e.target.value)}
                                                    className="w-full p-2.5 rounded-lg bg-gray-900 border border-gray-800 text-xs text-white"
                                                />
                                                <select 
                                                    value={newRatio} 
                                                    onChange={(e) => setNewRatio(e.target.value)}
                                                    className="w-full p-2.5 rounded-lg bg-gray-900 border border-gray-800 text-xs text-white"
                                                >
                                                    <option value="aspect-insta-post">Square (1:1)</option>
                                                    <option value="aspect-insta-portrait">Portrait Instagram (4:5)</option>
                                                    <option value="aspect-insta-story">Story / Reels (9:16)</option>
                                                </select>
                                                <button type="submit" className="w-full py-2.5 rounded-xl bg-indigo-600 text-white font-bold text-xs">
                                                    حفظ العمل
                                                </button>
                                            </form>
                                        )}
                                    </div>
                                )}
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
