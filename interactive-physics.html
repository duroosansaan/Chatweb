  // Canvas & Rulers Sizing
  function screenToWorld(sx, sy) {
    return { x: cam.panX + (sx - canvas.clientWidth / 2) / cam.ppm, y: cam.panY - (sy - canvas.clientHeight / 2) / cam.ppm };
  }
  function worldToScreen(wx, wy) {
    return { x: canvas.clientWidth / 2 + (wx - cam.panX) * cam.ppm, y: canvas.clientHeight / 2 - (wy - cam.panY) * cam.ppm };
  }

  function resizeCanvas() {
    const off = sim.world.showRulers ? 22 : 0;
    document.getElementById('rulerCorner').classList.toggle('hidden', !sim.world.showRulers);
    document.getElementById('rulerH').classList.toggle('hidden', !sim.world.showRulers);
    document.getElementById('rulerV').classList.toggle('hidden', !sim.world.showRulers);
    canvas.style.left = off + 'px';
    canvas.style.top = off + 'px';
    canvas.style.width = `calc(100% - ${off}px)`;
    canvas.style.height = `calc(100% - ${off}px)`;
    const dpr = window.devicePixelRatio || 1;
    canvas.width = Math.max(1, Math.floor(canvas.clientWidth * dpr));
    canvas.height = Math.max(1, Math.floor(canvas.clientHeight * dpr));
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    renderRulers();
  }
  window.addEventListener('resize', resizeCanvas);

  function renderRulers() {
    if (!sim.world.showRulers) return;
    const rH = document.getElementById('rulerH'), rV = document.getElementById('rulerV');
    const w = canvas.clientWidth, h = canvas.clientHeight, step = cam.ppm > 90 ? 0.5 : cam.ppm > 35 ? 1 : 2;
    let hHtml = '', vHtml = '';
    const minX = cam.panX - w / (2 * cam.ppm), maxX = cam.panX + w / (2 * cam.ppm);
    for (let x = Math.floor(minX / step) * step; x <= maxX; x += step) {
      const px = w / 2 + (x - cam.panX) * cam.ppm;
      hHtml += `<div style="position:absolute;left:${px}px;bottom:0;border-left:1px solid #64748b;height:10px;padding-left:2px;font-size:9px;color:#475569;" class="mono">${Number(x.toFixed(1))}</div>`;
    }
    const minY = cam.panY - h / (2 * cam.ppm), maxY = cam.panY + h / (2 * cam.ppm);
    for (let y = Math.floor(minY / step) * step; y <= maxY; y += step) {
      const py = h / 2 - (y - cam.panY) * cam.ppm;
      vHtml += `<div style="position:absolute;top:${py}px;right:0;border-top:1px solid #64748b;width:10px;font-size:8px;color:#475569;" class="mono">${Number(y.toFixed(1))}</div>`;
    }
    rH.innerHTML = hHtml; rV.innerHTML = vHtml;
  }

  // Pointer Interaction (zero-hang setPointerCapture)
  let drag = { type: 'none' };

  function topBodyAt(pt, tol) {
    for (let i = sim.bodies.length - 1; i >= 0; i--) {
      if (pointInBody(sim.bodies[i], pt, tol)) return sim.bodies[i];
    }
    return null;
  }
  function allBodiesAt(pt, tol) {
    const out = [];
    for (let i = sim.bodies.length - 1; i >= 0; i--) {
      if (pointInBody(sim.bodies[i], pt, tol)) out.push(sim.bodies[i]);
    }
    return out;
  }
  function constraintAt(pt, tol) {
    const map = new Map(sim.bodies.map(b => [b.id, b]));
    for (let i = sim.constraints.length - 1; i >= 0; i--) {
      const c = sim.constraints[i];
      const bA = c.bodyAId ? map.get(c.bodyAId) : null, bB = c.bodyBId ? map.get(c.bodyBId) : null;
      const pA = bA ? localToWorld(bA, c.localA) : c.localA;
      const pB = bB ? localToWorld(bB, c.localB) : c.localB;
      if (c.kind === 'pin' || c.kind === 'weld' || c.kind === 'motor' || c.kind === 'torque') {
        if (vLen(vSub(pt, pA)) <= tol * 1.4) return c;
      } else if (distToSegment(pt, pA, pB) <= tol) return c;
    }
    return null;
  }
  const maybeSnap = (pt) => {
    if (!sim.world.snapToGrid) return pt;
    const s = Math.max(0.05, sim.world.gridSpacing * 0.5);
    return { x: Math.round(pt.x / s) * s, y: Math.round(pt.y / s) * s };
  };

  canvas.addEventListener('pointerdown', (e) => {
    canvas.setPointerCapture(e.pointerId);
    const rect = canvas.getBoundingClientRect();
    const sx = e.clientX - rect.left, sy = e.clientY - rect.top;
    const rawW = screenToWorld(sx, sy), pt = maybeSnap(rawW), tol = 11 / cam.ppm;

    if (e.button === 1 || activeTool === 'pan') {
      drag = { type: 'pan', sx, sy, px: cam.panX, py: cam.panY }; return;
    }
    if (activeTool === 'zoom') {
      cam.ppm = clamp(cam.ppm * (e.altKey ? 0.8 : 1.25), 12, 240);
      renderRulers(); return;
    }
    if (activeTool === 'point') {
      pushUndo();
      const pb = makeBody({ shape: 'point', x: pt.x, y: pt.y, radius: 0.12, fillColor: '#1d4ed8' });
      sim.bodies.push(pb); selection = { bodyIds: [pb.id], constraintId: null };
      renderProperties(); return;
    }
    if (activeTool === 'polygon') {
      if (polyPts.length >= 3 && vLen(vSub(pt, polyPts[0])) <= tol * 1.4) {
        finishPoly(); return;
      }
      polyPts.push(pt); return;
    }
    if (['rect', 'square', 'circle', 'gear', 'pulley'].includes(activeTool)) {
      drag = { type: 'shape', tool: activeTool, a: pt, b: pt }; return;
    }
    if (activeTool === 'anchor') {
      const hit = topBodyAt(rawW, tol);
      if (hit) { pushUndo(); hit.isStatic = !hit.isStatic; hit.vx = 0; hit.vy = 0; hit.omega = 0; recalcBody(hit); selection = { bodyIds: [hit.id], constraintId: null }; renderProperties(); }
      return;
    }
    if (activeTool === 'pin' || activeTool === 'weld') {
      const hits = allBodiesAt(rawW, tol);
      if (hits.length >= 1) {
        pushUndo();
        const bA = hits[0], bB = hits[1] || null;
        const c = { id: nextId(activeTool), name: activeTool === 'pin' ? 'Pin Joint' : 'Rigid Joint', kind: activeTool, bodyAId: bA.id, bodyBId: bB ? bB.id : null, localA: worldToLocal(bA, rawW), localB: bB ? worldToLocal(bB, rawW) : rawW, referenceAngle: bB ? bB.angle - bA.angle : -bA.angle, enabled: true, color: '#1e293b' };
        sim.constraints.push(c); selection = { bodyIds: [], constraintId: c.id }; renderProperties();
      }
      return;
    }
    if (activeTool === 'hslot' || activeTool === 'vslot') {
      const hit = topBodyAt(rawW, tol);
      if (hit) {
        pushUndo();
        const c = { id: nextId('slot'), name: activeTool === 'hslot' ? 'Horiz Slot' : 'Vert Slot', kind: 'slot', bodyAId: hit.id, bodyBId: null, localA: worldToLocal(hit, rawW), localB: rawW, slotAngle: activeTool === 'hslot' ? 0 : Math.PI / 2, slotKeyed: false, slotLength: 4, enabled: true, color: '#0f172a' };
        sim.constraints.push(c); selection = { bodyIds: [], constraintId: c.id }; renderProperties();
      }
      return;
    }
    if (activeTool === 'motor') {
      const hits = allBodiesAt(rawW, tol);
      if (hits.length >= 1) {
        pushUndo();
        const bA = hits[0], bB = hits[1] || null;
        const pin = { id: nextId('pin'), name: 'Motor Pin', kind: 'pin', bodyAId: bA.id, bodyBId: bB ? bB.id : null, localA: worldToLocal(bA, rawW), localB: bB ? worldToLocal(bB, rawW) : rawW, enabled: true, color: '#334155' };
        const mot = { id: nextId('mot'), name: 'Motor', kind: 'motor', bodyAId: bA.id, bodyBId: bB ? bB.id : null, localA: worldToLocal(bA, rawW), localB: bB ? worldToLocal(bB, rawW) : rawW, motorTargetOmega: 3, motorMaxTorque: 80, enabled: true, color: '#dc2626' };
        sim.constraints.push(pin, mot); selection = { bodyIds: [], constraintId: mot.id }; renderProperties();
      }
      return;
    }
    if (activeTool === 'torque') {
      const hit = topBodyAt(rawW, tol);
      if (hit) { pushUndo(); const tq = { id: nextId('tq'), name: 'Torque', kind: 'torque', bodyAId: hit.id, bodyBId: null, localA: { x: 0, y: 0 }, localB: { x: 0, y: 0 }, torqueValue: 15, enabled: true, color: '#dc2626' }; sim.constraints.push(tq); selection = { bodyIds: [], constraintId: tq.id }; renderProperties(); }
      return;
    }
    if (activeTool === 'thruster') {
      const hit = topBodyAt(rawW, tol);
      if (hit) { pushUndo(); const l = worldToLocal(hit, rawW); hit.thruster = { enabled: true, fx: 25, fy: 0, localX: l.x, localY: l.y }; selection = { bodyIds: [hit.id], constraintId: null }; renderProperties(); }
      return;
    }
    if (['spring', 'damper', 'rope', 'rod', 'actuator', 'slot', 'force'].includes(activeTool)) {
      const hit = topBodyAt(rawW, tol);
      drag = { type: 'link', tool: activeTool, a: pt, b: pt, bId: hit ? hit.id : null, locA: hit ? worldToLocal(hit, rawW) : pt };
      return;
    }
    if (activeTool === 'rotate') {
      const hit = topBodyAt(rawW, tol);
      if (hit) { selection = { bodyIds: [hit.id], constraintId: null }; drag = { type: 'rot', id: hit.id, sa: hit.angle, pa: Math.atan2(rawW.y - hit.y, rawW.x - hit.x) }; renderProperties(); }
      return;
    }

    // Select Tool
    const hitB = topBodyAt(rawW, tol);
    if (hitB) {
      if (e.shiftKey) {
        selection.bodyIds = selection.bodyIds.includes(hitB.id) ? selection.bodyIds.filter(x => x !== hitB.id) : [...selection.bodyIds, hitB.id];
      } else if (!selection.bodyIds.includes(hitB.id)) {
        selection = { bodyIds: [hitB.id], constraintId: null };
      }
      renderProperties();
      if (isRunning) {
        dragSpring = { bodyId: hitB.id, localPoint: worldToLocal(hitB, rawW), targetWorld: rawW };
        drag = { type: 'grab' };
      } else {
        pushUndo();
        const init = new Map(sim.bodies.filter(b => selection.bodyIds.includes(b.id)).map(b => [b.id, { x: b.x, y: b.y }]));
        drag = { type: 'move', startW: rawW, init };
      }
      return;
    }
    const hitC = constraintAt(rawW, tol);
    if (hitC) { selection = { bodyIds: [], constraintId: hitC.id }; renderProperties(); return; }
    selection = { bodyIds: [], constraintId: null }; renderProperties();
    drag = { type: 'marquee', a: rawW, b: rawW };
  });

  canvas.addEventListener('pointermove', (e) => {
    const rect = canvas.getBoundingClientRect();
    const sx = e.clientX - rect.left, sy = e.clientY - rect.top;
    const rawW = screenToWorld(sx, sy), pt = maybeSnap(rawW);
    hoverWorld = rawW;
    document.getElementById('lblCoords').textContent = `X: ${rawW.x.toFixed(sim.world.precision)} m · Y: ${rawW.y.toFixed(sim.world.precision)} m`;

    if (drag.type === 'pan') {
      cam.panX = drag.px - (sx - drag.sx) / cam.ppm;
      cam.panY = drag.py + (sy - drag.sy) / cam.ppm;
      renderRulers();
    } else if (drag.type === 'grab' && dragSpring) {
      dragSpring.targetWorld = rawW;
    } else if (drag.type === 'move') {
      const dx = rawW.x - drag.startW.x, dy = rawW.y - drag.startW.y;
      for (const b of sim.bodies) {
        const orig = drag.init.get(b.id);
        if (orig) { const m = maybeSnap({ x: orig.x + dx, y: orig.y + dy }); b.x = m.x; b.y = m.y; b.tracePoints = []; }
      }
      renderProperties();
    } else if (drag.type === 'rot') {
      const b = sim.bodies.find(x => x.id === drag.id);
      if (b) { b.angle = drag.sa + (Math.atan2(rawW.y - b.y, rawW.x - b.x) - drag.pa); renderProperties(); }
    } else if (drag.type === 'shape' || drag.type === 'link') {
      drag.b = pt;
    } else if (drag.type === 'marquee') {
      drag.b = rawW;
    }
  });

  function finishDrag(e) {
    if (canvas.hasPointerCapture(e.pointerId)) canvas.releasePointerCapture(e.pointerId);
    const d = drag; drag = { type: 'none' }; dragSpring = null;
    if (d.type === 'marquee') {
      const x1 = Math.min(d.a.x, d.b.x), x2 = Math.max(d.a.x, d.b.x), y1 = Math.min(d.a.y, d.b.y), y2 = Math.max(d.a.y, d.b.y);
      if (x2 - x1 > 0.08 || y2 - y1 > 0.08) {
        selection = { bodyIds: sim.bodies.filter(b => b.x >= x1 && b.x <= x2 && b.y >= y1 && b.y <= y2).map(b => b.id), constraintId: null };
        renderProperties();
      }
    } else if (d.type === 'shape') {
      pushUndo();
      const dx = d.b.x - d.a.x, dy = d.b.y - d.a.y;
      let nb;
      if (d.tool === 'rect' || d.tool === 'square') {
        let w = Math.abs(dx), h = Math.abs(dy);
        if (d.tool === 'square') { const s = Math.max(w, h, 0.8); w = s; h = s; }
        else if (w < 0.25 && h < 0.25) { w = 1.6; h = 1.0; } else { w = Math.max(0.25, w); h = Math.max(0.25, h); }
        nb = makeBody({ shape: 'rect', x: d.tool === 'square' ? d.a.x + (dx >= 0 ? w / 2 : -w / 2) : (d.a.x + d.b.x) / 2, y: d.tool === 'square' ? d.a.y + (dy >= 0 ? h / 2 : -h / 2) : (d.a.y + d.b.y) / 2, width: w, height: h });
      } else {
        const r = Math.max(0.35, Math.hypot(dx, dy) < 0.1 ? 0.65 : Math.hypot(dx, dy));
        nb = makeBody({ shape: d.tool, x: d.a.x, y: d.a.y, radius: r, collidable: d.tool === 'circle' });
      }
      sim.bodies.push(nb); selection = { bodyIds: [nb.id], constraintId: null }; renderProperties();
    } else if (d.type === 'link') {
      const tol = 12 / cam.ppm, hitE = topBodyAt(d.b, tol), len = vLen(vSub(d.b, d.a));
      if (d.tool === 'force') {
        if (d.bId) {
          pushUndo();
          const fv = vSub(d.b, d.a);
          const fc = { id: nextId('f'), name: 'Force', kind: 'force', bodyAId: d.bId, bodyBId: null, localA: d.locA, localB: { x: 0, y: 0 }, forceX: len < 0.1 ? 20 : fv.x * 20, forceY: len < 0.1 ? 0 : fv.y * 20, enabled: true, color: '#dc2626' };
          sim.constraints.push(fc); selection = { bodyIds: [], constraintId: fc.id }; renderProperties();
        }
        return;
      }
      if (d.tool === 'slot') {
        if (d.bId) {
          pushUndo();
          const sc = { id: nextId('sl'), name: 'Slot', kind: 'slot', bodyAId: d.bId, bodyBId: null, localA: d.locA, localB: d.a, slotAngle: len > 0.1 ? Math.atan2(d.b.y - d.a.y, d.b.x - d.a.x) : 0, slotLength: Math.max(3, len * 2), enabled: true, color: '#0f172a' };
          sim.constraints.push(sc); selection = { bodyIds: [], constraintId: sc.id }; renderProperties();
        }
        return;
      }
      if (len < 0.12 && !d.bId && !hitE) return;
      pushUndo();
      let pulId = null;
      if (d.tool === 'rope') {
        const mid = { x: (d.a.x + d.b.x) / 2, y: (d.a.y + d.b.y) / 2 };
        const pul = sim.bodies.find(b => b.shape === 'pulley' && vLen(vSub(mid, b)) <= b.radius * 2.5);
        if (pul) pulId = pul.id;
      }
      const c = { id: nextId(d.tool), name: d.tool.toUpperCase(), kind: d.tool, bodyAId: d.bId, bodyBId: hitE ? hitE.id : null, localA: d.locA, localB: hitE ? worldToLocal(hitE, d.b) : d.b, restLength: Math.max(0.2, len), maxLength: Math.max(0.2, len), stiffness: 50, damping: d.tool === 'damper' ? 10 : 0.4, actuatorMode: 'sine', actuatorAmplitude: 0.4, actuatorFrequency: 3, pulleyBodyId: pulId, enabled: true, color: d.tool === 'spring' ? '#2563eb' : d.tool === 'rope' ? '#92400e' : '#1e293b' };
      sim.constraints.push(c); selection = { bodyIds: [], constraintId: c.id }; renderProperties();
    }
  }
  canvas.addEventListener('pointerup', finishDrag);
  canvas.addEventListener('pointercancel', finishDrag);
  canvas.addEventListener('dblclick', () => { if (activeTool === 'polygon') { finishPoly(); setActiveTool('select'); } });
  canvas.addEventListener('wheel', (e) => {
    e.preventDefault();
    const rect = canvas.getBoundingClientRect(), sx = e.clientX - rect.left, sy = e.clientY - rect.top;
    const before = screenToWorld(sx, sy);
    cam.ppm = clamp(cam.ppm * (e.deltaY < 0 ? 1.12 : 0.89), 12, 240);
    cam.panX = before.x - (sx - canvas.clientWidth / 2) / cam.ppm;
    cam.panY = before.y + (sy - canvas.clientHeight / 2) / cam.ppm;
    renderRulers();
  }, { passive: false });

  function finishPoly() {
    if (polyPts.length >= 3) {
      pushUndo();
      let cx = 0, cy = 0; polyPts.forEach(p => { cx += p.x; cy += p.y; }); cx /= polyPts.length; cy /= polyPts.length;
      const pb = makeBody({ shape: 'polygon', x: cx, y: cy, vertices: polyPts.map(p => ({ x: p.x - cx, y: p.y - cy })) });
      sim.bodies.push(pb); selection = { bodyIds: [pb.id], constraintId: null }; renderProperties();
    }
    polyPts = [];
  }

  // =========================================================================
  // 6. CANVAS RENDERER & SIMULATION LOOP
  // =========================================================================
  function drawScene() {
    const w = canvas.clientWidth, h = canvas.clientHeight;
    ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h);
    const minWX = cam.panX - w / (2 * cam.ppm), maxWX = cam.panX + w / (2 * cam.ppm);
    const minWY = cam.panY - h / (2 * cam.ppm), maxWY = cam.panY + h / (2 * cam.ppm);

    if (sim.world.showGrid) {
      const sp = Math.max(0.25, sim.world.gridSpacing);
      ctx.strokeStyle = '#e5e7eb'; ctx.lineWidth = 1; ctx.beginPath();
      for (let gx = Math.floor(minWX / sp) * sp; gx <= maxWX; gx += sp) { const x = worldToScreen(gx, 0).x; ctx.moveTo(x, 0); ctx.lineTo(x, h); }
      for (let gy = Math.floor(minWY / sp) * sp; gy <= maxWY; gy += sp) { const y = worldToScreen(0, gy).y; ctx.moveTo(0, y); ctx.lineTo(w, y); }
      ctx.stroke();
    }
    if (sim.world.showAxes) {
      const o = worldToScreen(0, 0);
      ctx.strokeStyle = '#94a3b8'; ctx.lineWidth = 1.2; ctx.beginPath();
      ctx.moveTo(0, o.y); ctx.lineTo(w, o.y); ctx.moveTo(o.x, 0); ctx.lineTo(o.x, h); ctx.stroke();
    }
    if (sim.world.showTrackPoints) {
      for (const b of sim.bodies) {
        if (b.trackCOM && b.tracePoints.length > 1) {
          ctx.strokeStyle = b.strokeColor; ctx.globalAlpha = 0.45; ctx.lineWidth = 1.2; ctx.beginPath();
          b.tracePoints.forEach((p, i) => { const s = worldToScreen(p.x, p.y); if (i === 0) ctx.moveTo(s.x, s.y); else ctx.lineTo(s.x, s.y); });
          ctx.stroke(); ctx.globalAlpha = 1;
        }
      }
    }

    const bMap = new Map(sim.bodies.map(b => [b.id, b]));
    for (const c of sim.constraints) if (c.kind === 'slot') drawConstraint(c, bMap);
    for (const b of sim.bodies) drawBody(b);
    for (const c of sim.constraints) if (c.kind !== 'slot') drawConstraint(c, bMap);

    // Vectors
    const vs = sim.world.vectorScale;
    for (const b of sim.bodies) {
      const o = worldToScreen(b.x, b.y);
      if (sim.world.showVectors.velocity) drawVec(o, b.vx * vs * cam.ppm, -b.vy * vs * cam.ppm, '#2563eb');
      if (sim.world.showVectors.acceleration) drawVec(o, b.ax * vs * cam.ppm * 0.5, -b.ay * vs * cam.ppm * 0.5, '#16a34a');
      if (sim.world.showVectors.force && !b.isStatic) drawVec(o, b.mass * b.ax * vs * cam.ppm * 0.08, -b.mass * b.ay * vs * cam.ppm * 0.08, '#dc2626');
    }

    // Preview shapes
    if (drag.type === 'shape') {
      const a = worldToScreen(drag.a.x, drag.a.y), b = worldToScreen(drag.b.x, drag.b.y);
      ctx.strokeStyle = '#2563eb'; ctx.fillStyle = 'rgba(147,197,253,0.35)'; ctx.lineWidth = 1.5;
      if (['circle', 'gear', 'pulley'].includes(drag.tool)) { ctx.beginPath(); ctx.arc(a.x, a.y, Math.hypot(b.x - a.x, b.y - a.y), 0, Math.PI * 2); ctx.fill(); ctx.stroke(); }
      else { ctx.fillRect(Math.min(a.x, b.x), Math.min(a.y, b.y), Math.abs(b.x - a.x), Math.abs(b.y - a.y)); ctx.strokeRect(Math.min(a.x, b.x), Math.min(a.y, b.y), Math.abs(b.x - a.x), Math.abs(b.y - a.y)); }
    } else if (drag.type === 'link' || drag.type === 'marquee') {
      const a = worldToScreen(drag.a.x, drag.a.y), b = worldToScreen(drag.b.x, drag.b.y);
      ctx.strokeStyle = '#2563eb'; ctx.lineWidth = 1.5; ctx.setLineDash([4, 3]);
      if (drag.type === 'marquee') ctx.strokeRect(Math.min(a.x, b.x), Math.min(a.y, b.y), Math.abs(b.x - a.x), Math.abs(b.y - a.y));
      else { ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke(); }
      ctx.setLineDash([]);
    }
    if (polyPts.length) {
      ctx.strokeStyle = '#2563eb'; ctx.beginPath();
      polyPts.forEach((p, i) => { const s = worldToScreen(p.x, p.y); if (i === 0) ctx.moveTo(s.x, s.y); else ctx.lineTo(s.x, s.y); });
      const hs = worldToScreen(hoverWorld.x, hoverWorld.y); ctx.lineTo(hs.x, hs.y); ctx.stroke();
    }
  }

  function drawBody(b) {
    const c = worldToScreen(b.x, b.y), isSel = selection.bodyIds.includes(b.id);
    ctx.save(); ctx.translate(c.x, c.y); ctx.rotate(-b.angle);
    ctx.fillStyle = b.fillColor; ctx.strokeStyle = isSel ? '#2563eb' : b.strokeColor; ctx.lineWidth = isSel ? 2.2 : 1.5;
    if (b.shape === 'point') { ctx.beginPath(); ctx.arc(0, 0, 5, 0, Math.PI * 2); ctx.fill(); ctx.stroke(); }
    else if (b.shape === 'circle' || b.shape === 'pulley') {
      const r = b.radius * cam.ppm; ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(r, 0); ctx.stroke();
      if (b.shape === 'pulley') { ctx.beginPath(); ctx.arc(0, 0, r * 0.75, 0, Math.PI * 2); ctx.stroke(); }
    } else if (b.shape === 'gear') {
      const r = b.radius * cam.ppm, t = b.teeth || 12;
      ctx.beginPath();
      for (let i = 0; i < t; i++) {
        const a0 = (i / t) * Math.PI * 2, a1 = ((i + 0.25) / t) * Math.PI * 2, a2 = ((i + 0.5) / t) * Math.PI * 2, a3 = ((i + 0.75) / t) * Math.PI * 2;
        if (i === 0) ctx.moveTo(Math.cos(a0) * r * 0.9, Math.sin(a0) * r * 0.9); else ctx.lineTo(Math.cos(a0) * r * 0.9, Math.sin(a0) * r * 0.9);
        ctx.lineTo(Math.cos(a1) * r * 1.1, Math.sin(a1) * r * 1.1); ctx.lineTo(Math.cos(a2) * r * 1.1, Math.sin(a2) * r * 1.1); ctx.lineTo(Math.cos(a3) * r * 0.9, Math.sin(a3) * r * 0.9);
      }
      ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.arc(0, 0, r * 0.26, 0, Math.PI * 2); ctx.fillStyle = '#fff'; ctx.fill(); ctx.stroke();
    } else if (b.shape === 'rect') {
      const w = b.width * cam.ppm, h = b.height * cam.ppm; ctx.fillRect(-w / 2, -h / 2, w, h); ctx.strokeRect(-w / 2, -h / 2, w, h);
    } else if (b.shape === 'polygon') {
      ctx.beginPath(); b.vertices.forEach((v, i) => { if (i === 0) ctx.moveTo(v.x * cam.ppm, -v.y * cam.ppm); else ctx.lineTo(v.x * cam.ppm, -v.y * cam.ppm); });
      ctx.closePath(); ctx.fill(); ctx.stroke();
    }
    if (b.isStatic) { ctx.strokeStyle = '#334155'; ctx.beginPath(); ctx.moveTo(-4, -4); ctx.lineTo(4, 4); ctx.moveTo(4, -4); ctx.lineTo(-4, 4); ctx.stroke(); }
    else if (sim.world.showCOM) { ctx.strokeStyle = '#1e293b'; ctx.lineWidth = 1; ctx.beginPath(); ctx.arc(0, 0, 4, 0, Math.PI * 2); ctx.moveTo(-6, 0); ctx.lineTo(6, 0); ctx.moveTo(0, -6); ctx.lineTo(0, 6); ctx.stroke(); }
    ctx.restore();
  }

  function drawConstraint(c, bMap) {
    const bA = c.bodyAId ? bMap.get(c.bodyAId) : null, bB = c.bodyBId ? bMap.get(c.bodyBId) : null;
    const pAW = bA ? localToWorld(bA, c.localA) : c.localA, pBW = bB ? localToWorld(bB, c.localB) : c.localB;
    const sA = worldToScreen(pAW.x, pAW.y), sB = worldToScreen(pBW.x, pBW.y);
    const isSel = selection.constraintId === c.id;
    ctx.save(); ctx.strokeStyle = isSel ? '#2563eb' : c.color; ctx.fillStyle = ctx.strokeStyle; ctx.lineWidth = isSel ? 2.4 : 1.6;
    if (c.kind === 'spring') {
      const dx = sB.x - sA.x, dy = sB.y - sA.y, d = Math.hypot(dx, dy) || 1, ux = dx / d, uy = dy / d, px = -uy, py = ux, lead = Math.min(12, d * 0.15);
      ctx.beginPath(); ctx.moveTo(sA.x, sA.y); ctx.lineTo(sA.x + ux * lead, sA.y + uy * lead);
      for (let i = 1; i < 20; i++) { const t = i / 20, side = i % 2 === 0 ? -7 : 7; ctx.lineTo(sA.x + ux * (lead + t * (d - 2 * lead)) + px * side, sA.y + uy * (lead + t * (d - 2 * lead)) + py * side); }
      ctx.lineTo(sB.x - ux * lead, sB.y - uy * lead); ctx.lineTo(sB.x, sB.y); ctx.stroke();
    } else if (c.kind === 'rope' && c.pulleyBodyId && bMap.get(c.pulleyBodyId)) {
      const p = bMap.get(c.pulleyBodyId), cp = worldToScreen(p.x, p.y), rp = p.radius * cam.ppm;
      ctx.beginPath(); ctx.moveTo(sA.x, sA.y); ctx.lineTo(cp.x - rp, cp.y); ctx.arc(cp.x, cp.y, rp, Math.PI, 0, false); ctx.lineTo(sB.x, sB.y); ctx.stroke();
    } else if (c.kind === 'pin') {
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(sA.x, sA.y, 4.5, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    } else if (c.kind === 'slot') {
      const ang = (bB ? bB.angle : 0) + (c.slotAngle || 0), hl = ((c.slotLength || 3.5) * cam.ppm) / 2;
      ctx.strokeStyle = '#cbd5e1'; ctx.lineWidth = 6; ctx.beginPath(); ctx.moveTo(sB.x - Math.cos(-ang) * hl, sB.y - Math.sin(-ang) * hl); ctx.lineTo(sB.x + Math.cos(-ang) * hl, sB.y + Math.sin(-ang) * hl); ctx.stroke();
      ctx.strokeStyle = isSel ? '#2563eb' : '#0f172a'; ctx.lineWidth = 1.4; ctx.beginPath(); ctx.arc(sA.x, sA.y, 4, 0, Math.PI * 2); ctx.stroke();
    } else if (c.kind === 'force') {
      drawVec(sA, (c.forceX || 0) * 2, -(c.forceY || 0) * 2, ctx.strokeStyle);
    } else if (c.kind !== 'motor' && c.kind !== 'torque') {
      ctx.beginPath(); ctx.moveTo(sA.x, sA.y); ctx.lineTo(sB.x, sB.y); ctx.stroke();
    } else {
      ctx.beginPath(); ctx.arc(sA.x, sA.y, 10, 0, Math.PI * 1.5); ctx.stroke();
    }
    ctx.restore();
  }

  function drawVec(o, dx, dy, color) {
    const l = Math.hypot(dx, dy); if (l < 3) return;
    const cap = Math.min(l, 160), tx = o.x + (dx / l) * cap, ty = o.y + (dy / l) * cap, ang = Math.atan2(dy, dx);
    ctx.save(); ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(o.x, o.y); ctx.lineTo(tx, ty); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(tx, ty); ctx.lineTo(tx - 7 * Math.cos(ang - 0.4), ty - 7 * Math.sin(ang - 0.4)); ctx.lineTo(tx - 7 * Math.cos(ang + 0.4), ty - 7 * Math.sin(ang + 0.4)); ctx.closePath(); ctx.fill();
    ctx.restore();
  }

  // Meters & Controls Overlay Rendering
  function sampleMetric(m) {
    const b = m.bodyId ? sim.bodies.find(x => x.id === m.bodyId) : sim.bodies[0];
    if (!b) return { v1: 0, v2: 0, v3: 0, labels: ['X', 'Y', ''], unit: '' };
    if (m.metric === 'position') return { v1: b.x, v2: b.y, v3: (b.angle * 180) / Math.PI, labels: ['X', 'Y', 'θ°'], unit: 'm' };
    if (m.metric === 'velocity') return { v1: b.vx, v2: b.vy, v3: Math.hypot(b.vx, b.vy), labels: ['Vx', 'Vy', '|V|'], unit: 'm/s' };
    if (m.metric === 'acceleration') return { v1: b.ax, v2: b.ay, v3: Math.hypot(b.ax, b.ay), labels: ['Ax', 'Ay', '|A|'], unit: 'm/s²' };
    if (m.metric === 'force') return { v1: b.mass * b.ax, v2: b.mass * b.ay, v3: b.mass * Math.hypot(b.ax, b.ay), labels: ['Fx', 'Fy', '|F|'], unit: 'N' };
    if (m.metric === 'momentum') return { v1: b.mass * b.vx, v2: b.mass * b.vy, v3: b.mass * Math.hypot(b.vx, b.vy), labels: ['Px', 'Py', '|P|'], unit: 'kg·m/s' };
    const ke = 0.5 * b.mass * (b.vx * b.vx + b.vy * b.vy) + 0.5 * b.inertia * b.omega * b.omega;
    const pe = sim.world.gravityMode === 'vertical' ? b.mass * Math.abs(sim.world.gy) * b.y : 0;
    return { v1: ke, v2: pe, v3: ke + pe, labels: ['KE', 'PE', 'Total'], unit: 'J' };
  }

  function renderOverlays() {
    overlayLayer.innerHTML = '';
    meters.forEach(m => {
      const s = sampleMetric(m);
      const win = document.createElement('div');
      win.className = 'meter-win';
      win.style.left = m.x + 'px'; win.style.top = m.y + 'px'; win.style.width = (m.width || 255) + 'px';
      win.innerHTML = `<div class="meter-head"><span>${m.title}</span><div><button class="win-btn" data-mode="graph">G</button><button class="win-btn" data-mode="digital">#</button><button class="win-btn" data-close="1">✕</button></div></div><div class="meter-body" id="mb_${m.id}"></div>`;
      win.querySelector('[data-close]').onclick = () => { meters = meters.filter(x => x.id !== m.id); renderOverlays(); };
      win.querySelectorAll('[data-mode]').forEach(btn => btn.onclick = () => { m.displayType = btn.dataset.mode; renderOverlays(); });
      makeDraggable(win.querySelector('.meter-head'), m);
      overlayLayer.appendChild(win);
      updateMeterBody(m, s);
    });
    controls.forEach(c => {
      const val = getCtrlVal(c);
      const win = document.createElement('div');
      win.className = 'ctrl-win';
      win.style.left = c.x + 'px'; win.style.top = c.y + 'px'; win.style.width = '210px';
      win.innerHTML = `<div class="ctrl-head"><span>${c.label}</span><button class="win-btn">✕</button></div><div style="padding:6px;background:#f8fafc;"><div class="mono" style="display:flex;justify-content:space-between;margin-bottom:3px;"><span>${c.min}</span><strong id="cv_${c.id}">${val.toFixed(2)} ${c.unit || ''}</strong><span>${c.max}</span></div><input type="range" min="${c.min}" max="${c.max}" step="${c.step}" value="${val}" style="width:100%;accent-color:#2563eb;"/></div>`;
      win.querySelector('.win-btn').onclick = () => { controls = controls.filter(x => x.id !== c.id); renderOverlays(); };
      win.querySelector('input').oninput = (e) => {
        const v = parseFloat(e.target.value);
        setCtrlVal(c, v);
        document.getElementById(`cv_${c.id}`).textContent = `${v.toFixed(2)} ${c.unit || ''}`;
      };
      makeDraggable(win.querySelector('.ctrl-head'), c);
      overlayLayer.appendChild(win);
    });
  }

  function updateMeterBody(m, s) {
    const el = document.getElementById(`mb_${m.id}`);
    if (!el) return;
    if (m.displayType === 'digital') {
      el.innerHTML = `<div class="mono" style="line-height:1.6;"><div style="color:#2563eb">${s.labels[0]}: ${s.v1.toFixed(2)} ${s.unit}</div><div style="color:#16a34a">${s.labels[1]}: ${s.v2.toFixed(2)} ${s.unit}</div><div style="color:#dc2626">${s.labels[2]}: ${s.v3.toFixed(2)} ${s.unit}</div></div>`;
    } else {
      let minV = -1, maxV = 1;
      if (m.data.length) {
        minV = Infinity; maxV = -Infinity;
        m.data.forEach(p => { minV = Math.min(minV, p.v1, p.v2, p.v3); maxV = Math.max(maxV, p.v1, p.v2, p.v3); });
        if (Math.abs(maxV - minV) < 1e-3) { minV -= 1; maxV += 1; } else { const pad = (maxV - minV) * 0.1; minV -= pad; maxV += pad; }
      }
      const w = 235, h = 85;
      const mk = (fn) => m.data.length < 2 ? '' : m.data.map((d, i) => `${i === 0 ? 'M' : 'L'}${((i / (m.data.length - 1)) * w).toFixed(1)},${(h - ((fn(d) - minV) / (maxV - minV)) * h).toFixed(1)}`).join(' ');
      el.innerHTML = `<svg width="100%" height="${h}" viewBox="0 0 ${w} ${h}" style="background:#f8fafc;border:1px solid #cbd5e1"><path d="${mk(d => d.v1)}" fill="none" stroke="#2563eb" stroke-width="1.5"/><path d="${mk(d => d.v2)}" fill="none" stroke="#16a34a" stroke-width="1.5"/><path d="${mk(d => d.v3)}" fill="none" stroke="#dc2626" stroke-width="1.5"/></svg><div class="mono" style="display:flex;justify-content:space-between;font-size:10px;margin-top:2px;"><span style="color:#2563eb">${s.labels[0]}:${s.v1.toFixed(1)}</span><span style="color:#16a34a">${s.labels[1]}:${s.v2.toFixed(1)}</span><span style="color:#dc2626">${s.labels[2]}:${s.v3.toFixed(1)}</span></div>`;
    }
  }

  function makeDraggable(handle, obj) {
    handle.onpointerdown = (e) => {
      e.stopPropagation();
      const sx = e.clientX, sy = e.clientY, ox = obj.x, oy = obj.y;
      handle.setPointerCapture(e.pointerId);
      handle.onpointermove = (ev) => { obj.x = Math.max(4, ox + ev.clientX - sx); obj.y = Math.max(4, oy + ev.clientY - sy); handle.parentElement.style.left = obj.x + 'px'; handle.parentElement.style.top = obj.y + 'px'; };
      handle.onpointerup = () => { handle.onpointermove = null; };
    };
  }

  function getCtrlVal(c) {
    if (c.targetType === 'world') return sim.world[c.property] ?? 0;
    if (c.targetType === 'body') { const b = sim.bodies.find(x => x.id === c.targetId); return b ? (b[c.property] ?? 0) : 0; }
    const con = sim.constraints.find(x => x.id === c.targetId); return con ? (con[c.property] ?? 0) : 0;
  }
  function setCtrlVal(c, v) {
    if (c.targetType === 'world') sim.world[c.property] = v;
    else if (c.targetType === 'body') { const b = sim.bodies.find(x => x.id === c.targetId); if (b) { b[c.property] = v; recalcBody(b); } }
    else { const con = sim.constraints.find(x => x.id === c.targetId); if (con) con[c.property] = v; }
  }

  // Properties Panel
  function renderProperties() {
    const pb = document.getElementById('propsBody'), pt = document.getElementById('propsTitle');
    pb.innerHTML = '';
    const b = selection.bodyIds.length === 1 ? sim.bodies.find(x => x.id === selection.bodyIds[0]) : null;
    const c = selection.constraintId ? sim.constraints.find(x => x.id === selection.constraintId) : null;

    if (b) {
      pt.textContent = 'Object Properties';
      pb.innerHTML = `
        <div><label class="field-lbl">Name</label><input class="field-inp" id="p_name" value="${b.name}"/></div>
        <div class="grid-2">
          <button class="btn-reset" id="p_anchor">${b.isStatic ? '⚓ Anchored' : 'Dynamic'}</button>
          <label class="check-row"><input type="checkbox" id="p_col" ${b.collidable ? 'checked' : ''}/> Collide</label>
        </div>
        <div class="props-sec"><div class="props-sec-title">Kinematics</div><div class="grid-2">
          <div><label class="field-lbl">X (m)</label><input type="number" step="0.1" class="field-inp mono" id="p_x" value="${b.x.toFixed(2)}"/></div>
          <div><label class="field-lbl">Y (m)</label><input type="number" step="0.1" class="field-inp mono" id="p_y" value="${b.y.toFixed(2)}"/></div>
          <div><label class="field-lbl">Vx (m/s)</label><input type="number" step="0.5" class="field-inp mono" id="p_vx" value="${b.vx.toFixed(2)}"/></div>
          <div><label class="field-lbl">Vy (m/s)</label><input type="number" step="0.5" class="field-inp mono" id="p_vy" value="${b.vy.toFixed(2)}"/></div>
          <div><label class="field-lbl">Angle (°)</label><input type="number" step="5" class="field-inp mono" id="p_ang" value="${((b.angle * 180) / Math.PI).toFixed(1)}"/></div>
          <div><label class="field-lbl">ω (rad/s)</label><input type="number" step="0.2" class="field-inp mono" id="p_om" value="${b.omega.toFixed(2)}"/></div>
        </div></div>
        <div class="props-sec"><div class="props-sec-title">Material</div><div class="grid-2">
          <div><label class="field-lbl">Mass (kg)</label><input type="number" step="0.5" min="0.05" class="field-inp mono" id="p_m" value="${b.mass.toFixed(2)}"/></div>
          <div><label class="field-lbl">Elasticity</label><input type="number" step="0.05" min="0" max="1" class="field-inp mono" id="p_e" value="${b.restitution.toFixed(2)}"/></div>
          <div><label class="field-lbl">Friction μk</label><input type="number" step="0.05" min="0" class="field-inp mono" id="p_mu" value="${b.kineticFriction.toFixed(2)}"/></div>
          <div><label class="field-lbl">Fill Color</label><input type="color" id="p_fill" value="${b.fillColor}" style="width:100%;height:24px;"/></div>
        </div>
        <label class="check-row"><input type="checkbox" id="p_trk" ${b.trackCOM ? 'checked' : ''}/> Track Path</label></div>`;
      pb.querySelector('#p_name').onchange = (e) => { b.name = e.target.value; };
      pb.querySelector('#p_anchor').onclick = () => { b.isStatic = !b.isStatic; recalcBody(b); renderProperties(); };
      pb.querySelector('#p_col').onchange = (e) => { b.collidable = e.target.checked; };
      pb.querySelector('#p_x').onchange = (e) => { b.x = parseFloat(e.target.value) || 0; };
      pb.querySelector('#p_y').onchange = (e) => { b.y = parseFloat(e.target.value) || 0; };
      pb.querySelector('#p_vx').onchange = (e) => { b.vx = parseFloat(e.target.value) || 0; };
      pb.querySelector('#p_vy').onchange = (e) => { b.vy = parseFloat(e.target.value) || 0; };
      pb.querySelector('#p_ang').onchange = (e) => { b.angle = ((parseFloat(e.target.value) || 0) * Math.PI) / 180; };
      pb.querySelector('#p_om').onchange = (e) => { b.omega = parseFloat(e.target.value) || 0; };
      pb.querySelector('#p_m').onchange = (e) => { b.mass = Math.max(0.05, parseFloat(e.target.value) || 1); recalcBody(b); };
      pb.querySelector('#p_e').onchange = (e) => { b.restitution = clamp(parseFloat(e.target.value) || 0, 0, 1); };
      pb.querySelector('#p_mu').onchange = (e) => { b.kineticFriction = Math.max(0, parseFloat(e.target.value) || 0); };
      pb.querySelector('#p_fill').oninput = (e) => { b.fillColor = e.target.value; };
      pb.querySelector('#p_trk').onchange = (e) => { b.trackCOM = e.target.checked; };
    } else if (c) {
      pt.textContent = 'Constraint Properties';
      pb.innerHTML = `<div><label class="field-lbl">Name</label><input class="field-inp" value="${c.name}" id="pc_n"/></div>
        ${c.kind === 'spring' ? `<div class="grid-2"><div><label class="field-lbl">Stiffness k</label><input type="number" class="field-inp mono" id="pc_k" value="${c.stiffness ?? 50}"/></div><div><label class="field-lbl">Rest L</label><input type="number" step="0.1" class="field-inp mono" id="pc_l" value="${(c.restLength ?? 1.5).toFixed(2)}"/></div></div>` : ''}
        ${c.kind === 'motor' ? `<div><label class="field-lbl">Speed ω (rad/s)</label><input type="number" step="0.5" class="field-inp mono" id="pc_w" value="${c.motorTargetOmega ?? 3}"/></div>` : ''}`;
      pb.querySelector('#pc_n').onchange = (e) => { c.name = e.target.value; };
      if (pb.querySelector('#pc_k')) pb.querySelector('#pc_k').onchange = (e) => { c.stiffness = Math.max(0, parseFloat(e.target.value) || 0); };
      if (pb.querySelector('#pc_l')) pb.querySelector('#pc_l').onchange = (e) => { c.restLength = Math.max(0.1, parseFloat(e.target.value) || 1); };
      if (pb.querySelector('#pc_w')) pb.querySelector('#pc_w').onchange = (e) => { c.motorTargetOmega = parseFloat(e.target.value) || 0; };
    } else {
      pt.textContent = 'Workspace Properties';
      pb.innerHTML = `<div class="props-sec" style="border:none;padding:0;"><div class="props-sec-title">Gravity & Air</div><div class="grid-2">
        <div><label class="field-lbl">Gx (m/s²)</label><input type="number" step="0.5" class="field-inp mono" id="pw_gx" value="${sim.world.gx}"/></div>
        <div><label class="field-lbl">Gy (m/s²)</label><input type="number" step="0.5" class="field-inp mono" id="pw_gy" value="${sim.world.gy}"/></div>
      </div><div><label class="field-lbl">Air Resistance</label><input type="number" step="0.02" min="0" class="field-inp mono" id="pw_air" value="${sim.world.airResistance}"/></div></div>`;
      pb.querySelector('#pw_gx').onchange = (e) => { sim.world.gx = parseFloat(e.target.value) || 0; };
      pb.querySelector('#pw_gy').onchange = (e) => { sim.world.gy = parseFloat(e.target.value) || 0; };
      pb.querySelector('#pw_air').onchange = (e) => { sim.world.airResistance = Math.max(0, parseFloat(e.target.value) || 0); };
    }
  }

  // Main Animation Loop
  let accum = 0, uiTick = 0;
  function frameLoop() {
    if (isRunning) {
      const steps = playbackSpeed >= 2 ? 2 : 1;
      accum += playbackSpeed < 1 ? playbackSpeed : 1;
      if (accum >= 1) {
        accum -= 1;
        for (let i = 0; i < steps; i++) {
          stepPhysics(sim, dragSpring);
          tapeFrames.push(captureFrame());
          if (tapeFrames.length > 1500) tapeFrames.shift();
          tapeIdx = tapeFrames.length - 1;
          meters.forEach(m => {
            const s = sampleMetric(m);
            m.data.push({ t: sim.time, v1: s.v1, v2: s.v2, v3: s.v3 });
            if (m.data.length > 180) m.data.shift();
          });
        }
      }
      if (++uiTick % 3 === 0) {
        updateTimeTapeUI();
        meters.forEach(m => updateMeterBody(m, sampleMetric(m)));
      }
    }
    drawScene();
    requestAnimationFrame(frameLoop);
  }

  function updateTimeTapeUI() {
    document.getElementById('lblTime').textContent = `${sim.time.toFixed(sim.world.precision)} s`;
    document.getElementById('lblFrame').textContent = String(sim.frame);
    const sc = document.getElementById('tapeScrubber');
    sc.max = String(Math.max(0, tapeFrames.length - 1));
    sc.value = String(tapeIdx);
  }

  // Actions, Menus & Toolbar
  function loadPresetById(id) {
    isRunning = false; updateRunBtn();
    bundle = getPreset(id);
    sim = JSON.parse(JSON.stringify(bundle.state));
    initialReset = JSON.parse(JSON.stringify(bundle.state));
    meters = bundle.meters; controls = bundle.controls;
    tapeFrames = [captureFrame()]; tapeIdx = 0;
    undoStack = []; redoStack = [];
    selection = { bodyIds: [], constraintId: null };
    document.getElementById('presetSelect').value = id;
    resizeCanvas(); renderOverlays(); renderProperties(); updateTimeTapeUI();
  }

  function updateRunBtn() {
    const btn = document.getElementById('btnRun');
    btn.classList.toggle('running', isRunning);
    btn.textContent = isRunning ? '■ Stop' : '▶ Run';
  }

  function toggleRun() {
    if (!isRunning && sim.frame === 0) { initialReset = JSON.parse(JSON.stringify(sim)); tapeFrames = [captureFrame()]; }
    isRunning = !isRunning; updateRunBtn();
  }

  function doReset() {
    isRunning = false; updateRunBtn();
    sim = JSON.parse(JSON.stringify(initialReset));
    tapeFrames = [captureFrame()]; tapeIdx = 0;
    meters.forEach(m => { m.data = []; });
    renderOverlays(); renderProperties(); updateTimeTapeUI();
  }

  function runAction(act) {
    if (act === 'new') loadPresetById('blank');
    else if (act === 'open') document.getElementById('openFileInput').click();
    else if (act === 'save') {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([JSON.stringify({ state: sim, meters, controls }, null, 2)], { type: 'application/json' }));
      a.download = 'simulation.ipjson'; a.click();
    } else if (act === 'undo' && undoStack.length) { redoStack.push(JSON.parse(JSON.stringify(sim))); sim = undoStack.pop(); renderProperties(); }
    else if (act === 'redo' && redoStack.length) { undoStack.push(JSON.parse(JSON.stringify(sim))); sim = redoStack.pop(); renderProperties(); }
    else if (act === 'delete') {
      pushUndo();
      const del = new Set(selection.bodyIds);
      sim.bodies = sim.bodies.filter(b => !del.has(b.id));
      sim.constraints = sim.constraints.filter(c => c.id !== selection.constraintId && !(c.bodyAId && del.has(c.bodyAId)) && !(c.bodyBId && del.has(c.bodyBId)));
      selection = { bodyIds: [], constraintId: null }; renderProperties();
    } else if (act === 'duplicate' && selection.bodyIds.length) {
      pushUndo();
      const newIds = [];
      sim.bodies.filter(b => selection.bodyIds.includes(b.id)).forEach(b => {
        const c = JSON.parse(JSON.stringify(b)); c.id = nextId('b'); c.x += 0.5; c.y -= 0.5; c.tracePoints = [];
        sim.bodies.push(c); newIds.push(c.id);
      });
      selection = { bodyIds: newIds, constraintId: null }; renderProperties();
    } else if (act === 'selectAll') { selection = { bodyIds: sim.bodies.map(b => b.id), constraintId: null }; }
    else if (act === 'clearTracks') { sim.bodies.forEach(b => b.tracePoints = []); }
    else if (act === 'toggleGrid') { sim.world.showGrid = !sim.world.showGrid; document.getElementById('btnGrid').classList.toggle('active', sim.world.showGrid); }
    else if (act === 'toggleSnap') { sim.world.snapToGrid = !sim.world.snapToGrid; document.getElementById('btnSnap').classList.toggle('active', sim.world.snapToGrid); }
    else if (act === 'toggleRulers') { sim.world.showRulers = !sim.world.showRulers; resizeCanvas(); }
    else if (act === 'toggleAxes') { sim.world.showAxes = !sim.world.showAxes; }
    else if (act === 'zoomIn') { cam.ppm = clamp(cam.ppm * 1.2, 12, 240); renderRulers(); }
    else if (act === 'zoomOut') { cam.ppm = clamp(cam.ppm * 0.83, 12, 240); renderRulers(); }
    else if (act === 'zoomReset') { cam = { panX: 0, panY: 0, ppm: 55 }; renderRulers(); }
    else if (act === 'toggleProps') { document.getElementById('propsPanel').classList.toggle('hidden'); resizeCanvas(); }
    else if (act === 'toggleVectors') { const on = !(sim.world.showVectors.velocity || sim.world.showVectors.force); sim.world.showVectors.velocity = on; sim.world.showVectors.force = on; document.getElementById('btnVectors').classList.toggle('active', on); }
    else if (act === 'vecVel') sim.world.showVectors.velocity = !sim.world.showVectors.velocity;
    else if (act === 'vecAcc') sim.world.showVectors.acceleration = !sim.world.showVectors.acceleration;
    else if (act === 'vecForce') sim.world.showVectors.force = !sim.world.showVectors.force;
    else if (act === 'toggleElectro') sim.world.electrostaticsEnabled = !sim.world.electrostaticsEnabled;
    else if (act === 'toggleAnchor') { sim.bodies.filter(b => selection.bodyIds.includes(b.id)).forEach(b => { b.isStatic = !b.isStatic; recalcBody(b); }); renderProperties(); }
    else if (act === 'toggleCollide') { sim.bodies.filter(b => selection.bodyIds.includes(b.id)).forEach(b => { b.collidable = !b.collidable; }); renderProperties(); }
    else if (act === 'meshGears') {
      const gs = sim.bodies.filter(b => b.shape === 'gear');
      for (let i = 0; i < gs.length; i++) for (let j = i + 1; j < gs.length; j++) {
        if (vLen(vSub(gs[i], gs[j])) <= (gs[i].radius + gs[j].radius) * 1.25)
          sim.constraints.push({ id: nextId('mesh'), name: 'Gear Mesh', kind: 'gearMesh', bodyAId: gs[i].id, bodyBId: gs[j].id, localA: { x: 0, y: 0 }, localB: { x: 0, y: 0 }, enabled: true, color: '#475569' });
      }
    } else if (act === 'clearMeters') { meters = []; renderOverlays(); }
    else if (act === 'tileMeters') { meters.forEach((m, i) => { m.x = 16 + (i % 3) * 265; m.y = 16 + Math.floor(i / 3) * 165; }); renderOverlays(); }
  }

  function openDialog(kind) {
    const bd = document.getElementById('modalBackdrop'), mc = document.getElementById('modalContent'), mt = document.getElementById('modalTitle');
    mc.innerHTML = ''; bd.classList.add('open');
    if (kind === 'gravity') {
      mt.textContent = 'World Gravity';
      mc.innerHTML = `<div><label class="field-lbl">Gravity Y (m/s²)</label><input type="number" step="0.1" id="dg_gy" class="field-inp mono" value="${sim.world.gy}"/></div>
        <div style="display:flex;gap:6px;"><button class="btn-reset" data-g="-9.81">Earth (-9.81)</button><button class="btn-reset" data-g="-1.62">Moon (-1.62)</button><button class="btn-reset" data-g="0">Zero-G (0)</button></div>`;
      mc.querySelector('#dg_gy').onchange = (e) => { sim.world.gy = parseFloat(e.target.value) || 0; renderProperties(); };
      mc.querySelectorAll('[data-g]').forEach(btn => btn.onclick = () => { sim.world.gy = parseFloat(btn.dataset.g); mc.querySelector('#dg_gy').value = sim.world.gy; renderProperties(); });
    } else if (kind === 'air') {
      mt.textContent = 'Air Resistance';
      mc.innerHTML = `<div><label class="field-lbl">Drag Coefficient</label><input type="number" step="0.01" min="0" id="da_r" class="field-inp mono" value="${sim.world.airResistance}"/></div>`;
      mc.querySelector('#da_r').onchange = (e) => { sim.world.airResistance = Math.max(0, parseFloat(e.target.value) || 0); renderProperties(); };
    } else if (kind === 'accuracy') {
      mt.textContent = 'Simulation Accuracy';
      mc.innerHTML = `<div class="grid-2"><div><label class="field-lbl">Substeps</label><input type="number" min="1" max="20" id="dac_s" class="field-inp mono" value="${sim.world.substeps}"/></div><div><label class="field-lbl">Solver Iterations</label><input type="number" min="2" max="40" id="dac_i" class="field-inp mono" value="${sim.world.solverIterations}"/></div></div>`;
      mc.querySelector('#dac_s').onchange = (e) => { sim.world.substeps = clamp(parseInt(e.target.value, 10) || 6, 1, 20); };
      mc.querySelector('#dac_i').onchange = (e) => { sim.world.solverIterations = clamp(parseInt(e.target.value, 10) || 10, 2, 40); };
    } else if (kind === 'newControl') {
      mt.textContent = 'New Gravity Control Slider';
      controls.push({ id: nextId('c'), label: 'Gravity Y', targetType: 'world', targetId: null, property: 'gy', min: -20, max: 0, step: 0.2, unit: 'm/s²', x: 24, y: 24 });
      renderOverlays(); bd.classList.remove('open');
    } else if (kind === 'help') {
      mt.textContent = 'Interactive Physics Guide';
      mc.innerHTML = `<p><strong>Run/Stop:</strong> Spacebar or click ▶ Run.</p><p><strong>Live Grab:</strong> Grab and fling objects with the Select tool while running.</p><p><strong>Pulleys & Ropes:</strong> Draw a Rope over a Pulley to automatically wrap it.</p>`;
    }
  }
  document.getElementById('modalCloseBtn').onclick = () => document.getElementById('modalBackdrop').classList.remove('open');
  document.getElementById('modalOkBtn').onclick = () => document.getElementById('modalBackdrop').classList.remove('open');

  // Menu dropdown toggling
  let openMenu = null;
  function closeMenus() { openMenu = null; document.querySelectorAll('.menu-btn').forEach(b => b.classList.remove('open')); document.querySelectorAll('.menu-dropdown').forEach(d => d.classList.remove('open')); }
  document.querySelectorAll('.menu-btn').forEach(btn => {
    btn.onclick = (e) => {
      e.stopPropagation();
      const k = btn.dataset.menu;
      if (openMenu === k) closeMenus();
      else { closeMenus(); openMenu = k; btn.classList.add('open'); document.getElementById(`menu-${k}`).classList.add('open'); }
    };
  });
  window.addEventListener('pointerdown', (e) => { if (!e.target.closest('#menuBar')) closeMenus(); });
  document.querySelectorAll('[data-act]').forEach(el => el.onclick = () => { closeMenus(); runAction(el.dataset.act); });
  document.querySelectorAll('[data-preset]').forEach(el => el.onclick = () => { closeMenus(); loadPresetById(el.dataset.preset); });
  document.querySelectorAll('[data-dialog]').forEach(el => el.onclick = () => { closeMenus(); openDialog(el.dataset.dialog); });
  document.querySelectorAll('[data-meter]').forEach(el => el.onclick = () => {
    closeMenus();
    const b = sim.bodies.find(x => x.id === selection.bodyIds[0]) || sim.bodies[0];
    meters.push({ id: nextId('m'), title: `${b ? b.name : ''} ${el.dataset.meter}`, bodyId: b ? b.id : null, metric: el.dataset.meter, displayType: 'graph', x: 20 + meters.length * 22, y: 20 + meters.length * 22, width: 255, data: [] });
    renderOverlays();
  });

  document.getElementById('btnRun').onclick = toggleRun;
  document.getElementById('btnReset').onclick = doReset;
  document.getElementById('btnStepFwd').onclick = () => { if (!isRunning) { stepPhysics(sim, null); tapeFrames.push(captureFrame()); tapeIdx = tapeFrames.length - 1; updateTimeTapeUI(); } };
  document.getElementById('btnStepBack').onclick = () => { if (!isRunning && tapeIdx > 0) { restoreFrame(tapeFrames[--tapeIdx]); updateTimeTapeUI(); } };
  document.getElementById('tapeBack').onclick = () => document.getElementById('btnStepBack').click();
  document.getElementById('tapeFwd').onclick = () => document.getElementById('btnStepFwd').click();
  document.getElementById('tapeStart').onclick = () => { if (!isRunning && tapeFrames.length) { tapeIdx = 0; restoreFrame(tapeFrames[0]); updateTimeTapeUI(); } };
  document.getElementById('tapeEnd').onclick = () => { if (!isRunning && tapeFrames.length) { tapeIdx = tapeFrames.length - 1; restoreFrame(tapeFrames[tapeIdx]); updateTimeTapeUI(); } };
  document.getElementById('tapeScrubber').oninput = (e) => { if (!isRunning) { tapeIdx = parseInt(e.target.value, 10); restoreFrame(tapeFrames[tapeIdx]); updateTimeTapeUI(); } };
  document.getElementById('speedSelect').onchange = (e) => { playbackSpeed = parseFloat(e.target.value); };
  document.getElementById('presetSelect').onchange = (e) => loadPresetById(e.target.value);
  document.getElementById('btnDelSel').onclick = () => runAction('delete');
  document.getElementById('btnDupSel').onclick = () => runAction('duplicate');
  document.getElementById('openFileInput').onchange = (e) => {
    const f = e.target.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = () => {
      try {
        const p = JSON.parse(String(r.result));
        if (p && p.state) { sim = p.state; initialReset = JSON.parse(JSON.stringify(p.state)); meters = p.meters || []; controls = p.controls || []; tapeFrames = [captureFrame()]; tapeIdx = 0; renderOverlays(); renderProperties(); updateTimeTapeUI(); }
      } catch {}
    };
    r.readAsText(f);
  };
  window.addEventListener('keydown', (e) => {
    if (['INPUT', 'SELECT', 'TEXTAREA'].includes(e.target.tagName)) return;
    if (e.code === 'Space') { e.preventDefault(); toggleRun(); }
    else if (e.key === 'Delete') runAction('delete');
    else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); runAction('undo'); }
    else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'y') { e.preventDefault(); runAction('redo'); }
  });

  // Boot
  resizeCanvas();
  renderOverlays();
  renderProperties();
  updateTimeTapeUI();
  requestAnimationFrame(frameLoop);
})();
</script>
</body>
</html>
